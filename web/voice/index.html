<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Lloyd" />
<meta name="theme-color" content="#0b0b0c" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon.svg" />
<title>Lloyd</title>
<style>
  :root{ --bg:#0b0b0c;--card:#151517;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
    --text:#f5f5f7;--muted:#a1a1aa;--hint:#6b6b73;--accent:#3b82f6;--accent-bg:rgba(59,130,246,.16);
    --you-bg:#1e3a5f;--you-text:#cfe0f5;--ll-bg:#1c1c1f;--ok:#37c48f;--err:#e2504a; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  body{display:flex;flex-direction:column;height:100dvh}
  header{padding:calc(16px + env(safe-area-inset-top)) 20px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:.5px solid var(--line)}
  .title{font-size:20px;font-weight:600}.sub{font-size:12px;color:var(--muted);margin-top:2px}
  .pill{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
  .log{flex:1;padding:16px;display:flex;flex-direction:column;gap:10px;overflow:auto}
  .hint{color:var(--hint);font-size:14px;text-align:center;margin-top:12px;padding:0 20px}
  .bubble{max-width:82%;padding:10px 13px;border-radius:16px;font-size:15px;line-height:1.45;white-space:pre-wrap}
  .you{align-self:flex-end;background:var(--you-bg);color:var(--you-text)}
  .ll{align-self:flex-start;background:var(--ll-bg)}
  footer{padding:16px 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:12px;border-top:.5px solid var(--line)}
  .status{font-size:14px;color:var(--muted);min-height:20px}
  .micwrap{position:relative;width:88px;height:88px}
  .ring{position:absolute;inset:0;border-radius:50%;background:var(--accent-bg);opacity:0}
  .mic{position:absolute;inset:0;border-radius:50%;border:.5px solid var(--line2);background:var(--card);
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);padding:0}
  .mic svg{width:36px;height:36px}
  .rec .mic{background:var(--accent-bg);color:var(--accent);border-color:transparent}
  .rec .ring{animation:pulse 1.5s ease-out infinite}
  @keyframes pulse{0%{transform:scale(1);opacity:.6}70%{transform:scale(1.9);opacity:0}100%{opacity:0}}
  .think .mic{color:var(--accent);border-color:transparent;background:var(--accent-bg)}
  .think .ring{animation:pulse 2s ease-out infinite;background:rgba(226,180,74,.16)}
  .dots span{display:inline-block;width:5px;height:5px;border-radius:50%;background:currentColor;margin:0 1px;opacity:.3;animation:blink 1s infinite}
  .dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
</style>
</head>
<body>
  <header>
    <div><div class="title">Lloyd</div><div class="sub">Chief of staff</div></div>
    <div class="pill"><span class="dot" id="dot"></span><span id="conn">ready</span></div>
  </header>
  <div class="log" id="log"><div class="hint">Tap once to start, then just talk — Lloyd answers out loud and keeps going. For a long ask, pause freely and say “over” when you’re done. Talk over him to cut him off. Tap again to stop.</div></div>
  <footer>
    <div class="status" id="status">Tap to talk</div>
    <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:6px">
      <button id="waketgl" type="button" aria-pressed="true"
        style="font-size:12px;color:var(--muted);background:transparent;border:.5px solid var(--line2);border-radius:14px;padding:4px 12px">Wake word: on</button>
      <button id="odtgl" type="button" aria-pressed="true" hidden
        style="font-size:12px;color:var(--muted);background:transparent;border:.5px solid var(--line2);border-radius:14px;padding:4px 12px">On-device: on</button>
      <button id="mutetgl" type="button" aria-pressed="false" hidden
        style="font-size:12px;color:var(--muted);background:transparent;border:.5px solid var(--line2);border-radius:14px;padding:4px 12px">Mute</button>
    </div>
    <div class="micwrap" id="wrap">
      <div class="ring"></div>
      <button class="mic" id="mic" aria-label="Talk to Lloyd">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/>
        </svg>
      </button>
    </div>
    <form id="typeform" style="display:flex;gap:8px;width:100%">
      <input id="typein" type="text" enterkeyhint="send" autocomplete="off" autocapitalize="sentences" placeholder="or type to Lloyd…"
        style="flex:1;min-width:0;padding:11px 14px;border-radius:22px;border:.5px solid var(--line2);background:var(--card);color:var(--text);font-size:16px;outline:none" />
      <button id="typesend" type="submit" aria-label="Send"
        style="flex:0 0 auto;width:44px;border-radius:22px;border:.5px solid var(--line2);background:var(--accent-bg);color:var(--accent);display:flex;align-items:center;justify-content:center;padding:0">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
      </button>
    </form>
    <div style="font-size:10px;color:var(--hint);margin-top:2px">build 0711-mute</div>
  </footer>
<script>
(function(){
  var mic=document.getElementById('mic'),wrap=document.getElementById('wrap'),status=document.getElementById('status'),
      log=document.getElementById('log'),conn=document.getElementById('conn'),dot=document.getElementById('dot');
  var qk=new URLSearchParams(location.search).get('k');
  if(qk){try{localStorage.setItem('voiceToken',qk);}catch(e){}}
  var token=qk||(function(){try{return localStorage.getItem('voiceToken')||'';}catch(e){return'';}})();
  var actx=null,session=false,stream=null,analyser=null,mr=null,chunks=[],utterRec=false,speaking=false,vadRAF=null,lastVoice=0,speechMs=0,noiseFloor=0.03,utterStart=0,curSource=null,curAudioEl=null,playAbort=null,bargeMs=0,muted=false;
  var MAXUTTER=30000; // hard cap on ONE continuous segment (was 12s — chopped long dictation)
  var END_SILENCE=2000; // pause before a segment ends; continuation words then decide keep-going vs done
  var accText='', accBubble=null, finalizeTimer=null; // accumulate segments into one turn across pauses
  var wakeOn=(function(){try{return localStorage.getItem('wakeWord')!=='0';}catch(e){return true;}})(); // default on
  // On-device recognition: Apple's own dictation via the browser's SpeechRecognition,
  // when present. Gives better transcripts + endpointing, streaming, no Azure round-trip.
  // Default ON when supported; falls back to the Azure record-and-upload path if absent
  // or if the engine errors (permission/service). Toggle persists in localStorage.
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  var onDevice=!!SR && (function(){try{return localStorage.getItem('onDevice')!=='0';}catch(e){return true;}})();
  var rec=null,recActive=false,recStopWanted=false,recFinal='';
  // Conversation window: right after Lloyd answers, a follow-up doesn't need the wake
  // word again (nobody re-says "Lloyd" for their next ask). Reset on each answer.
  var followUpUntil=0;
  function wakeNeeded(firstSeg){ return wakeOn && firstSeg && Date.now()>followUpUntil; }
  function listenLabel(){ return session ? ((wakeOn&&Date.now()>followUpUntil)?'Listening… say “Lloyd…” (tap to stop)':'Listening… just talk (tap to stop)') : 'Tap to talk'; }
  function setThinking(on){ wrap.classList.toggle('think',!!on); if(on) status.innerHTML='Thinking<span class="dots"><span></span><span></span><span></span></span>'; }
  // Answers computed while the tile was backgrounded are waiting server-side; pull
  // them when we return to the foreground. Times are the SERVER's (lastTs from the
  // server), so client/server clock skew never matters.
  var lastTs=(function(){try{return Number(localStorage.getItem('voiceLastTs'))||0;}catch(e){return 0;}})();
  var shownTs={};
  function saveLastTs(){ try{localStorage.setItem('voiceLastTs',String(lastTs));}catch(e){} }
  function markSeen(ts){ if(ts){ shownTs[ts]=1; if(ts>lastTs){ lastTs=ts; saveLastTs(); } } }
  async function syncHistory(initial){ try{
    var r=await fetch('/history?k='+encodeURIComponent(token)+'&since='+lastTs); if(!r.ok)return;
    var d=await r.json(); if(!d)return;
    if(initial && !lastTs){ lastTs=d.now||0; saveLastTs(); return; } // first open: don't dump old history
    (d.turns||[]).forEach(function(t){ if(!t||t.ts<=lastTs||shownTs[t.ts])return; shownTs[t.ts]=1; if(t.transcript)bubble(t.transcript,'you'); bubble(t.reply,'ll'); if(t.ts>lastTs)lastTs=t.ts; });
    saveLastTs();
  }catch(e){} }
  function ensureCtx(){try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}return actx;}
  var fillerBufs=[];
  async function loadFiller(){ if(fillerBufs.length||!actx)return; try{
    var m=await fetch('/filler'); if(!m.ok)return; var count=((await m.json())||{}).count||1;
    for(var i=0;i<count;i++){ (function(idx){ fetch('/filler?i='+idx).then(function(r){return r.ok?r.arrayBuffer():null;}).then(function(ab){ if(ab&&actx)actx.decodeAudioData(ab,function(b){fillerBufs.push(b);},function(){}); }).catch(function(){}); })(i); }
  }catch(e){} }
  function playFiller(){ try{ if(fillerBufs.length&&actx){ var b=fillerBufs[Math.floor(Math.random()*fillerBufs.length)]; var s=actx.createBufferSource(); s.buffer=b; s.connect(actx.destination); s.start(0); } }catch(e){} }
  function stopPlayback(){ try{ if(curSource){curSource.onended=null;curSource.stop();} }catch(e){} curSource=null; try{ if(curAudioEl){curAudioEl.pause();curAudioEl.src='';} }catch(e){} curAudioEl=null; }
  // Reveal `text` into `el` over `ms`, so his reply appears on screen roughly in
  // step with his voice (typewriter feel). Cancelled if a newer reveal starts.
  var revealTok=0;
  function revealInto(el,text,ms){ if(!el)return; var me=++revealTok,n=text.length,start=performance.now(),dur=Math.max(400,ms||n/16*1000);
    function step(){ if(me!==revealTok)return; var p=Math.min(1,(performance.now()-start)/dur); el.textContent=text.slice(0,Math.ceil(p*n)); log.scrollTop=log.scrollHeight; if(p<1)requestAnimationFrame(step); else el.textContent=text; }
    requestAnimationFrame(step);
  }
  function playB64(b64,type,reveal){
    return new Promise(function(resolve){
      function fallback(){try{var a=new Audio('data:'+(type||'audio/mpeg')+';base64,'+b64);curAudioEl=a;if(reveal)revealInto(reveal.el,reveal.text,0);a.onended=function(){curAudioEl=null;resolve();};a.play().catch(function(){resolve();});}catch(e){resolve();}}
      try{
        var ctx=ensureCtx(); if(!ctx){return fallback();}
        var bin=atob(b64),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
        ctx.decodeAudioData(u.buffer,function(buf){var s=ctx.createBufferSource();s.buffer=buf;s.connect(ctx.destination);curSource=s;if(reveal)revealInto(reveal.el,reveal.text,buf.duration*1000);s.onended=function(){curSource=null;resolve();};s.start(0);},function(){fallback();});
      }catch(e){fallback();}
    });
  }
  function hintGone(){var h=log.querySelector('.hint');if(h)h.remove();}
  function bubble(t,who){hintGone();var b=document.createElement('div');b.className='bubble '+(who==='you'?'you':'ll');b.textContent=t;log.appendChild(b);log.scrollTop=log.scrollHeight;return b;}
  function setRec(on){wrap.classList.toggle('rec',on);}
  function fail(msg){conn.textContent='error';dot.style.background='var(--err)';status.textContent=msg;}
  async function startSession(){
    ensureCtx();
    loadFiller();
    if(onDevice && SR){ startOnDevice(); return; } // Apple's recognizer handles mic + endpointing
    try{ stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}}); }
    catch(e){ fail('Mic blocked — allow microphone access'); return; }
    try{ var src=actx.createMediaStreamSource(stream); analyser=actx.createAnalyser(); analyser.fftSize=1024; src.connect(analyser); }
    catch(e){ fail('Audio init failed — reload'); return; }
    session=true; speaking=false; utterRec=false; setRec(true);
    status.textContent=listenLabel();
    calibrate(); vadRAF=requestAnimationFrame(vadLoop); paintMute();
  }
  // Tear down the mic + recognizer. Shared by stop and mute: stopping the track
  // (not just a flag) truly cuts capture AND clears the OS mic indicator.
  function stopMic(){
    if(vadRAF)cancelAnimationFrame(vadRAF);
    recStopWanted=true; try{ if(rec){ (rec.abort||rec.stop).call(rec); } }catch(e){} recActive=false;
    try{ if(mr&&utterRec){mr.onstop=null;mr.stop();} }catch(e){} utterRec=false;
    if(stream){stream.getTracks().forEach(function(t){t.stop();});stream=null;}
  }
  function stopSession(){
    session=false; muted=false; stopMic();
    setRec(false); resetAcc(); setThinking(false); status.textContent='Tap to talk'; paintMute();
  }
  // ---- On-device (Apple Web Speech) path ----
  function startOnDevice(){ session=true; speaking=false; utterRec=false; setRec(true); resetAcc(); status.textContent=listenLabel(); paintMute(); srStart(); }
  function srFallback(){ onDevice=false; if(paintOnDev)paintOnDev(); if(session){ session=false; setRec(false); startSession(); } } // permission/service denied -> Azure path
  function srStart(){
    if(!onDevice||!SR||!session||recActive||speaking||muted) return;
    try{ rec=new SR(); }catch(e){ srFallback(); return; }
    rec.lang='en-US'; try{rec.interimResults=true;}catch(e){} try{rec.continuous=false;}catch(e){}
    recFinal=''; recStopWanted=false;
    rec.onstart=function(){ recActive=true; };
    rec.onerror=function(e){ recActive=false; var er=(e&&e.error)||''; if(er==='not-allowed'||er==='service-not-allowed'){ srFallback(); } };
    rec.onresult=function(e){ var fin='',intr=''; for(var i=e.resultIndex;i<e.results.length;i++){ var tr=e.results[i][0].transcript; if(e.results[i].isFinal) fin+=tr+' '; else intr+=tr; } if(fin) recFinal=(recFinal+' '+fin).replace(/\s+/g,' ').trim(); var cur=(recFinal+' '+intr).trim(); if(cur&&!speaking) status.textContent='“'+cur.slice(-70)+'”'; };
    rec.onend=function(){ recActive=false; if(recStopWanted){ recStopWanted=false; return; } onSrUtterance(recFinal.trim()); };
    try{ rec.start(); }catch(e){ recActive=false; }
  }
  async function onSrUtterance(text){
    if(!session||speaking) return;
    var t=String(text||'').trim();
    if(!t){ srStart(); return; } // heard nothing this run — keep listening
    var firstSeg=!accText && !accBubble;
    var ac=new AbortController(); playAbort=ac;
    try{
      var useWake=wakeNeeded(firstSeg);
      var r1=await fetch('/voice?k='+encodeURIComponent(token)+'&stt=1&wake='+(useWake?'1':'0'),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text:t}),signal:ac.signal});
      if(r1.status===401){ fail('Not authorized — check the link'); session=false; return; }
      var d1=await r1.json();
      await onSegment(d1, firstSeg, ac); // same gate as the audio path
    }catch(e){ if(e&&e.name==='AbortError'){ return; } if(playAbort===ac) playAbort=null; resumeListen(); }
  }
  function level(){ var b=new Uint8Array(analyser.fftSize); analyser.getByteTimeDomainData(b); var s=0; for(var i=0;i<b.length;i++){var v=(b[i]-128)/128;s+=v*v;} return Math.sqrt(s/b.length); }
  function calibrate(){ var n=0,sum=0; var t=setInterval(function(){ if(!session){clearInterval(t);return;} sum+=level(); if(++n>=15){ clearInterval(t); noiseFloor=Math.max(0.02,sum/n); } },33); }
  // Speech gate sits a margin ABOVE the running noise floor, so road noise raises the
  // bar instead of reading as speech. Higher cap (0.35) tolerates a loud truck cabin.
  function curThreshold(){ return Math.min(0.35, Math.max(0.045, noiseFloor*2.2 + 0.015)); }
  function endUtterance(){ utterRec=false; speaking=true; status.textContent=accText?'…':'Thinking…'; try{mr.stop();}catch(e){} }
  function startUtterance(){ try{ chunks=[]; mr=new MediaRecorder(stream); }catch(e){ return; }
    // NB: do NOT clear the finalize timer here — a brief noise blip that never becomes
    // real speech (speechMs<=350) would otherwise keep resetting it and Lloyd would
    // never stop listening. The finalize callback is guarded by !utterRec, and a REAL
    // segment reschedules it in sendUtterance, so we only reset on confirmed speech.
    utterStart=performance.now();
    mr.ondataavailable=function(e){ if(e.data&&e.data.size)chunks.push(e.data); };
    mr.onstop=function(){ var b=new Blob(chunks,{type:mr.mimeType||'audio/mp4'}); if(speechMs>350) sendUtterance(b); else resumeListen(); };
    mr.start(); utterRec=true; speechMs=0;
  }
  // Accumulation across pauses: a segment that trails off on a filler/conjunction is
  // held (accText) and the next segment appended, so a long, pause-heavy request is ONE
  // turn. A finalize timer sends what we have if you actually go quiet.
  function clearFinalize(){ if(finalizeTimer){clearTimeout(finalizeTimer);finalizeTimer=null;} }
  function scheduleFinalize(){ clearFinalize(); finalizeTimer=setTimeout(function(){ if(session&&!utterRec&&accText.trim()) answer(accText.trim()); },4000); }
  function resetAcc(){ clearFinalize(); accText=''; accBubble=null; }
  function vadLoop(){ if(!session||muted)return; vadRAF=requestAnimationFrame(vadLoop); if(!analyser)return;
    var l=level(), now=performance.now(), thr=curThreshold();
    if(speaking){ // Lloyd is thinking/talking — barge-in: sustained speech over him interrupts
      if(l>thr*1.6){ bargeMs+=16; if(bargeMs>180) bargeIn(); } else { bargeMs=Math.max(0,bargeMs-16); }
      return;
    }
    if(l>thr){ if(!utterRec)startUtterance(); lastVoice=now; if(utterRec)speechMs+=16; }
    else {
      // Adapt the noise floor only when quiet and not mid-utterance, so changing road
      // noise moves the gate with it instead of being mistaken for speech.
      if(!utterRec) noiseFloor=noiseFloor*0.9+l*0.1;
      if(utterRec && now-lastVoice>END_SILENCE) endUtterance();
    }
    // Failsafe: never let sustained noise hold an utterance open forever (would mean
    // the filler + reply never fire) — force close+send after MAXUTTER.
    if(utterRec && now-utterStart>MAXUTTER) endUtterance();
  }
  function bargeIn(){ bargeMs=0; stopPlayback(); if(playAbort){try{playAbort.abort();}catch(e){}} setThinking(false); resetAcc(); speaking=false; status.textContent='Listening…'; startUtterance(); lastVoice=performance.now(); }
  // Audio (VAD) path: upload the segment for STT, then run the shared gate.
  async function sendUtterance(blob){
    var firstSeg=!accText && !accBubble; // opening segment of a (possibly multi-part) turn
    var ac=new AbortController(); playAbort=ac;
    try{
      var useWake=wakeNeeded(firstSeg); // only the OPENING segment must contain "Lloyd"
      var r1=await fetch('/voice?k='+encodeURIComponent(token)+'&stt=1&wake='+(useWake?'1':'0'),{method:'POST',headers:{'content-type':blob.type||'audio/mp4'},body:blob,signal:ac.signal});
      if(r1.status===401){ fail('Not authorized — check the link'); session=false; return; }
      var d1=await r1.json();
      await onSegment(d1, firstSeg, ac);
    }catch(e){ if(e&&e.name==='AbortError'){ return; } if(playAbort===ac) playAbort=null; resumeListen(); }
  }
  // Shared gate for a recognized segment (from Azure STT or on-device recognition):
  // wake gate, accumulate trailing-off segments, answer on a real ending / "over".
  async function onSegment(d1, firstSeg, ac){
    if(ac.signal.aborted) return;
    var useWake=wakeNeeded(firstSeg);
    if(useWake && d1.accepted===false){ // wake word not heard on the opener — say why, keep listening
      status.textContent='(say “Lloyd” first)'; setTimeout(function(){ if(session&&!speaking&&!utterRec&&!accText) status.textContent=listenLabel(); },1600);
      if(playAbort===ac) playAbort=null; resumeListen(); return;
    }
    var seg=(d1.command!=null?d1.command:d1.transcript)||'';
    if(firstSeg && !seg && d1.reply){ // addressed by name only ("Lloyd") -> spoken "Yes?"
      var yb=bubble('','ll'); status.textContent='Speaking…'; if(d1.audio) await playB64(d1.audio,d1.audioType,{el:yb,text:d1.reply}); else yb.textContent=d1.reply;
      if(playAbort===ac) playAbort=null; resumeListen(); return;
    }
    if(!seg && !d1.finish){ if(playAbort===ac) playAbort=null; resumeListen(); return; } // empty/garbled — ignore (unless explicit "over")
    if(firstSeg){ try{ if(navigator.vibrate) navigator.vibrate(25); }catch(e){} } // haptic "got it"
    if(seg) accText = accText ? (accText+' '+seg) : seg;
    if(accText){ if(!accBubble) accBubble=bubble(accText,'you'); else { accBubble.textContent=accText; log.scrollTop=log.scrollHeight; } }
    if(playAbort===ac) playAbort=null;
    if(d1.finish){ answer(accText); return; } // explicit "over" / "send it" — answer everything so far, now
    if(d1.continuation){ speaking=false; status.textContent='Listening… go on'; scheduleFinalize(); if(onDevice) setTimeout(srStart,300); return; } // mid-thought — keep listening & append
    answer(accText); // landed on a real ending — go answer the whole thing
  }
  // Phase 2: the model turn (+ TTS) on the full accumulated command.
  async function answer(command){
    clearFinalize(); speaking=true;
    if(onDevice){ recStopWanted=true; try{ if(rec){ (rec.abort||rec.stop).call(rec); } }catch(e){} recActive=false; } // don't let the recognizer hear Lloyd
    var text=String(command||'').trim(); resetAcc();
    if(!text){ resumeListen(); return; }
    var ac=new AbortController(); playAbort=ac;
    playFiller();        // spoken "let me check…" cue
    setThinking(true);   // visible thinking state until the answer lands
    try{
      var r2=await fetch('/voice?k='+encodeURIComponent(token),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text:text,speak:true}),signal:ac.signal});
      if(r2.status===401){ fail('Not authorized — check the link'); session=false; return; }
      var d2=await r2.json();
      if(ac.signal.aborted) return;
      setThinking(false);
      markSeen(d2.ts); // shown live — don't re-render it from /history on the next resume
      var lb=bubble('','ll');
      if(d2.audio){ status.textContent='Speaking…'; await playB64(d2.audio,d2.audioType,{el:lb,text:d2.reply||''}); }
      else { lb.textContent=d2.reply||''; if(d2.reply) status.textContent='(no audio — check silent switch)'; }
      followUpUntil=Date.now()+20000; // open a 20s window for a wake-word-free follow-up
    }catch(e){ setThinking(false); if(e&&e.name==='AbortError'){ return; } bubble('(connection problem — I didn’t catch that)','ll'); }
    if(playAbort===ac) playAbort=null;
    resumeListen();
  }
  function resumeListen(){ speaking=false; if(session&&!muted){ status.textContent=listenLabel(); if(onDevice) setTimeout(srStart,300); } } // iOS needs a beat before restarting recognition
  mic.addEventListener('click',function(){ ensureCtx(); if(!session) startSession(); else stopSession(); });
  var waketgl=document.getElementById('waketgl');
  function paintWake(){ waketgl.textContent='Wake word: '+(wakeOn?'on':'off'); waketgl.setAttribute('aria-pressed',String(wakeOn)); waketgl.style.color=wakeOn?'var(--accent)':'var(--muted)'; if(session) status.textContent=listenLabel(); }
  waketgl.addEventListener('click',function(){ wakeOn=!wakeOn; try{localStorage.setItem('wakeWord',wakeOn?'1':'0');}catch(e){} paintWake(); });
  paintWake();
  var odtgl=document.getElementById('odtgl');
  function paintOnDev(){ if(!odtgl)return; odtgl.textContent='On-device: '+(onDevice?'on':'off'); odtgl.setAttribute('aria-pressed',String(onDevice)); odtgl.style.color=onDevice?'var(--accent)':'var(--muted)'; }
  if(SR){ odtgl.hidden=false; paintOnDev();
    odtgl.addEventListener('click',function(){ onDevice=!onDevice; try{localStorage.setItem('onDevice',onDevice?'1':'0');}catch(e){} paintOnDev(); if(session){ var was=session; session=false; recStopWanted=true; try{if(rec)(rec.abort||rec.stop).call(rec);}catch(e){} recActive=false; if(vadRAF)cancelAnimationFrame(vadRAF); if(stream){stream.getTracks().forEach(function(t){t.stop();});stream=null;} setRec(false); resetAcc(); if(was) startSession(); } });
  }
  var mutetgl=document.getElementById('mutetgl');
  function paintMute(){ if(!mutetgl)return; mutetgl.hidden=!session; mutetgl.textContent=muted?'Muted':'Mute'; mutetgl.setAttribute('aria-pressed',String(muted)); mutetgl.style.color=muted?'var(--accent)':'var(--muted)'; }
  // Mute truly cuts the mic (stops the track + halts VAD/recognizer), not just a UI
  // flag. Unmute re-acquires the mic and resumes. Only meaningful during a session.
  function setMuted(on){
    if(!session){ muted=false; paintMute(); return; }
    if(on){ muted=true; stopMic(); setThinking(false); setRec(false); status.textContent='Muted — tap Mute to resume'; paintMute(); }
    else { muted=false; paintMute(); startSession(); }
  }
  mutetgl.addEventListener('click',function(){ setMuted(!muted); });
  var typein=document.getElementById('typein');
  document.getElementById('typeform').addEventListener('submit',async function(e){
    e.preventDefault();
    var val=(typein.value||'').trim(); if(!val)return;
    typein.value=''; typein.blur();
    bubble(val,'you'); status.textContent='Thinking…';
    try{
      var res=await fetch('/voice?k='+encodeURIComponent(token),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text:val,speak:false})});
      if(res.status===401){ fail('Not authorized — check the link'); return; }
      var data=await res.json();
      if(data.reply)bubble(data.reply,'ll');
      markSeen(data.ts);
    }catch(err){ bubble('(connection problem — try again)','ll'); }
    status.textContent = listenLabel();
  });
  // Pull any answers finished while we were away, on open and whenever we return.
  syncHistory(true);
  document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible') syncHistory(); });
  window.addEventListener('pageshow',function(){ syncHistory(); });
})();
</script>
