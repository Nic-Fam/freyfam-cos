<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Lloyd" />
<meta name="theme-color" content="#0b0b0c" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon.svg" />
<title>Lloyd</title>
<style>
  :root{ --bg:#0b0b0c;--card:#151517;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
    --text:#f5f5f7;--muted:#a1a1aa;--hint:#6b6b73;--accent:#3b82f6;--accent-bg:rgba(59,130,246,.16);
    --you-bg:#1e3a5f;--you-text:#cfe0f5;--ll-bg:#1c1c1f;--ok:#37c48f;--err:#e2504a; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  body{display:flex;flex-direction:column;height:100dvh}
  header{padding:calc(16px + env(safe-area-inset-top)) 20px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:.5px solid var(--line)}
  .title{font-size:20px;font-weight:600}.sub{font-size:12px;color:var(--muted);margin-top:2px}
  .pill{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
  .log{flex:1;padding:16px;display:flex;flex-direction:column;gap:10px;overflow:auto}
  .hint{color:var(--hint);font-size:14px;text-align:center;margin-top:12px;padding:0 20px}
  .bubble{max-width:82%;padding:10px 13px;border-radius:16px;font-size:15px;line-height:1.45;white-space:pre-wrap}
  .you{align-self:flex-end;background:var(--you-bg);color:var(--you-text)}
  .ll{align-self:flex-start;background:var(--ll-bg)}
  footer{padding:16px 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:12px;border-top:.5px solid var(--line)}
  .status{font-size:14px;color:var(--muted);min-height:20px}
  .micwrap{position:relative;width:88px;height:88px}
  .ring{position:absolute;inset:0;border-radius:50%;background:var(--accent-bg);opacity:0}
  .mic{position:absolute;inset:0;border-radius:50%;border:.5px solid var(--line2);background:var(--card);
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);padding:0}
  .mic svg{width:36px;height:36px}
  .rec .mic{background:var(--accent-bg);color:var(--accent);border-color:transparent}
  .rec .ring{animation:pulse 1.5s ease-out infinite}
  @keyframes pulse{0%{transform:scale(1);opacity:.6}70%{transform:scale(1.9);opacity:0}100%{opacity:0}}
</style>
</head>
<body>
  <header>
    <div><div class="title">Lloyd</div><div class="sub">Chief of staff</div></div>
    <div class="pill"><span class="dot" id="dot"></span><span id="conn">ready</span></div>
  </header>
  <div class="log" id="log"><div class="hint">Tap once to start, then just talk — Lloyd answers out loud and keeps going. Talk over him to cut him off. Tap again to stop.</div></div>
  <footer>
    <div class="status" id="status">Tap to talk</div>
    <div class="micwrap" id="wrap">
      <div class="ring"></div>
      <button class="mic" id="mic" aria-label="Talk to Lloyd">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/>
        </svg>
      </button>
    </div>
    <form id="typeform" style="display:flex;gap:8px;width:100%">
      <input id="typein" type="text" enterkeyhint="send" autocomplete="off" autocapitalize="sentences" placeholder="or type to Lloyd…"
        style="flex:1;min-width:0;padding:11px 14px;border-radius:22px;border:.5px solid var(--line2);background:var(--card);color:var(--text);font-size:16px;outline:none" />
      <button id="typesend" type="submit" aria-label="Send"
        style="flex:0 0 auto;width:44px;border-radius:22px;border:.5px solid var(--line2);background:var(--accent-bg);color:var(--accent);display:flex;align-items:center;justify-content:center;padding:0">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
      </button>
    </form>
  </footer>
<script>
(function(){
  var mic=document.getElementById('mic'),wrap=document.getElementById('wrap'),status=document.getElementById('status'),
      log=document.getElementById('log'),conn=document.getElementById('conn'),dot=document.getElementById('dot');
  var qk=new URLSearchParams(location.search).get('k');
  if(qk){try{localStorage.setItem('voiceToken',qk);}catch(e){}}
  var token=qk||(function(){try{return localStorage.getItem('voiceToken')||'';}catch(e){return'';}})();
  var actx=null,session=false,stream=null,analyser=null,mr=null,chunks=[],utterRec=false,speaking=false,vadRAF=null,lastVoice=0,speechMs=0,threshold=0.02,curSource=null,curAudioEl=null,playAbort=null,bargeMs=0;
  function ensureCtx(){try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}return actx;}
  function stopPlayback(){ try{ if(curSource){curSource.onended=null;curSource.stop();} }catch(e){} curSource=null; try{ if(curAudioEl){curAudioEl.pause();curAudioEl.src='';} }catch(e){} curAudioEl=null; }
  function playB64(b64,type){
    return new Promise(function(resolve){
      function fallback(){try{var a=new Audio('data:'+(type||'audio/mpeg')+';base64,'+b64);curAudioEl=a;a.onended=function(){curAudioEl=null;resolve();};a.play().catch(function(){resolve();});}catch(e){resolve();}}
      try{
        var ctx=ensureCtx(); if(!ctx){return fallback();}
        var bin=atob(b64),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
        ctx.decodeAudioData(u.buffer,function(buf){var s=ctx.createBufferSource();s.buffer=buf;s.connect(ctx.destination);curSource=s;s.onended=function(){curSource=null;resolve();};s.start(0);},function(){fallback();});
      }catch(e){fallback();}
    });
  }
  function hintGone(){var h=log.querySelector('.hint');if(h)h.remove();}
  function bubble(t,who){hintGone();var b=document.createElement('div');b.className='bubble '+(who==='you'?'you':'ll');b.textContent=t;log.appendChild(b);log.scrollTop=log.scrollHeight;return b;}
  function setRec(on){wrap.classList.toggle('rec',on);}
  function fail(msg){conn.textContent='error';dot.style.background='var(--err)';status.textContent=msg;}
  async function startSession(){
    ensureCtx();
    try{ stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}}); }
    catch(e){ fail('Mic blocked — allow microphone access'); return; }
    try{ var src=actx.createMediaStreamSource(stream); analyser=actx.createAnalyser(); analyser.fftSize=1024; src.connect(analyser); }
    catch(e){ fail('Audio init failed — reload'); return; }
    session=true; speaking=false; utterRec=false; setRec(true);
    status.textContent='Listening… just talk (tap to stop)';
    calibrate(); vadRAF=requestAnimationFrame(vadLoop);
  }
  function stopSession(){
    session=false; if(vadRAF)cancelAnimationFrame(vadRAF);
    try{ if(mr&&utterRec){mr.onstop=null;mr.stop();} }catch(e){} utterRec=false;
    if(stream){stream.getTracks().forEach(function(t){t.stop();});stream=null;}
    setRec(false); status.textContent='Tap to talk';
  }
  function level(){ var b=new Uint8Array(analyser.fftSize); analyser.getByteTimeDomainData(b); var s=0; for(var i=0;i<b.length;i++){var v=(b[i]-128)/128;s+=v*v;} return Math.sqrt(s/b.length); }
  function calibrate(){ var n=0,sum=0; var t=setInterval(function(){ if(!session){clearInterval(t);return;} sum+=level(); if(++n>=15){ clearInterval(t); threshold=Math.min(0.08,Math.max(0.02,(sum/n)*2.5)); } },33); }
  function startUtterance(){ try{ chunks=[]; mr=new MediaRecorder(stream); }catch(e){ return; }
    mr.ondataavailable=function(e){ if(e.data&&e.data.size)chunks.push(e.data); };
    mr.onstop=function(){ var b=new Blob(chunks,{type:mr.mimeType||'audio/mp4'}); if(speechMs>350) sendUtterance(b); else resumeListen(); };
    mr.start(); utterRec=true; speechMs=0;
  }
  function vadLoop(){ if(!session)return; vadRAF=requestAnimationFrame(vadLoop); if(!analyser)return;
    var l=level(), now=performance.now();
    if(speaking){ // Lloyd is thinking/talking — barge-in: sustained speech over him interrupts
      if(l>threshold*1.6){ bargeMs+=16; if(bargeMs>180) bargeIn(); } else { bargeMs=Math.max(0,bargeMs-16); }
      return;
    }
    if(l>threshold){ if(!utterRec)startUtterance(); lastVoice=now; if(utterRec)speechMs+=16; }
    else if(utterRec && now-lastVoice>900){ utterRec=false; speaking=true; status.textContent='Thinking…'; try{mr.stop();}catch(e){} }
  }
  function bargeIn(){ bargeMs=0; stopPlayback(); if(playAbort){try{playAbort.abort();}catch(e){}} speaking=false; status.textContent='Listening…'; startUtterance(); lastVoice=performance.now(); }
  async function sendUtterance(blob){
    var ac=new AbortController(); playAbort=ac;
    try{
      var res=await fetch('/voice?k='+encodeURIComponent(token),{method:'POST',headers:{'content-type':blob.type||'audio/mp4'},body:blob,signal:ac.signal});
      if(res.status===401){ fail('Not authorized — check the link'); session=false; return; }
      var data=await res.json();
      if(ac.signal.aborted) return; // user barged in during the request
      if(data.transcript)bubble(data.transcript,'you');
      if(data.reply)bubble(data.reply,'ll');
      if(data.audio){ status.textContent='Speaking…'; await playB64(data.audio,data.audioType); }
      else if(data.reply){ status.textContent='(no audio — check silent switch)'; }
    }catch(e){ if(e&&e.name==='AbortError'){ return; } bubble('(connection problem — I didn’t catch that)','ll'); }
    if(playAbort===ac) playAbort=null;
    resumeListen();
  }
  function resumeListen(){ speaking=false; if(session) status.textContent='Listening… just talk (tap to stop)'; }
  mic.addEventListener('click',function(){ ensureCtx(); if(!session) startSession(); else stopSession(); });
  var typein=document.getElementById('typein');
  document.getElementById('typeform').addEventListener('submit',async function(e){
    e.preventDefault();
    var val=(typein.value||'').trim(); if(!val)return;
    typein.value=''; typein.blur();
    bubble(val,'you'); status.textContent='Thinking…';
    try{
      var res=await fetch('/voice?k='+encodeURIComponent(token),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text:val,speak:false})});
      if(res.status===401){ fail('Not authorized — check the link'); return; }
      var data=await res.json();
      if(data.reply)bubble(data.reply,'ll');
    }catch(err){ bubble('(connection problem — try again)','ll'); }
    status.textContent = session ? 'Listening… just talk (tap to stop)' : 'Tap to talk';
  });
})();
</script>
</body>
</html>
